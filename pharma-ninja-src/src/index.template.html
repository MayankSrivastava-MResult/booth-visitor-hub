<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pharma Ninja · MResult</title>
<!--
  PHARMA NINJA — MResult booth game (Global Pharma Partnering Summit 2026)
  Milestone 1: Wednesday prototype.
  Single self-contained file: Phaser 3.90.0, fonts (Barlow, SIL OFL) and the
  logo are inlined. No network is used at runtime.

  Layers:
    #stage  Phaser canvas: capsules, slicing, particles, trail, attract demo
    #ui     DOM screens on top: attract, name entry, domain picker, HUD,
            results, admin. DOM is used for anything text-heavy so it stays
            crisp at any resolution.
-->
<style>
@font-face { font-family: 'Barlow'; font-weight: 500; font-style: normal; font-display: block; src: url(data:font/woff2;base64,__FONT_B500__) format('woff2'); }
@font-face { font-family: 'Barlow'; font-weight: 600; font-style: normal; font-display: block; src: url(data:font/woff2;base64,__FONT_B600__) format('woff2'); }
@font-face { font-family: 'Barlow Condensed'; font-weight: 700; font-style: normal; font-display: block; src: url(data:font/woff2;base64,__FONT_C700__) format('woff2'); }
@font-face { font-family: 'Barlow Condensed'; font-weight: 800; font-style: normal; font-display: block; src: url(data:font/woff2;base64,__FONT_C800__) format('woff2'); }
@font-face { font-family: 'Barlow Condensed'; font-weight: 800; font-style: italic; font-display: block; src: url(data:font/woff2;base64,__FONT_C800I__) format('woff2'); }

/* ---- Tokens ---- */
:root {
  --orange: #F7943E; --orange-deep: #D9741F; --orange-soft: #FFB070;
  --charcoal: #1F1F1F; --deep: #181818; --panel: #2A2A2A; --panel-2: #232323; --line: #4A4A4A;
  --white: #FFFFFF; --capsule: #F5F3EF; --grey: #D6D6D6; --muted: #A3A3A3; --miss: #FF6B5E;
  --display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --body: 'Barlow', 'Segoe UI', system-ui, sans-serif;
  /* 1rem = 10 design px on a 1080-px short edge, so the 1920x1080 mockups map 1:1 */
  font-size: calc(100vmin / 108);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--charcoal); color: var(--white); overflow: hidden;
  font-family: var(--body); -webkit-font-smoothing: antialiased;
  /* kiosk basics (full hardening lands in Milestone 2) */
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 0.3rem solid var(--white); outline-offset: 0.3rem; }

#stage { position: fixed; inset: 0; }
#stage canvas { display: block; }
#ui { position: fixed; inset: 0; pointer-events: none; }
.screen { position: absolute; inset: 0; display: none; pointer-events: auto; }
.screen.on { display: block; }
.hud.on { pointer-events: none; }

.display { font-family: var(--display); font-weight: 800; font-style: italic; line-height: 1; }
.btn-primary { background: var(--orange); color: var(--charcoal); border-radius: 999px; font-family: var(--display); font-weight: 800; font-style: italic; }
.btn-ghost { border-radius: 999px; box-shadow: inset 0 0 0 0.2rem var(--line); font-weight: 600; }
.btn-primary:active { transform: scale(0.97); }

/* ---- Attract ---- */
#s-attract { display: none; }
#s-attract.on { display: grid; grid-template-columns: 1fr 48rem; }
.attract-main { position: relative; }
.attract-lockup { position: absolute; left: 0; right: 0; top: 23%; display: flex; justify-content: center; align-items: center; gap: 5.6rem; }
.attract-lockup .wm { width: 66rem; }
.attract-lockup .mascot { width: 25rem; }
.attract-tag { position: absolute; left: 0; right: 0; top: 56%; text-align: center; font-size: 3.2rem; font-weight: 500; color: var(--grey); }
.attract-cta { position: absolute; left: 0; right: 0; top: 65%; display: flex; justify-content: center; }
.attract-cta .btn-primary { display: flex; align-items: center; gap: 2.2rem; font-size: 6.4rem; padding: 2.6rem 6.4rem 2.6rem 4.6rem;
  box-shadow: 0 0 0 1rem rgba(247,148,62,0.22), 0 0 0 2.2rem rgba(247,148,62,0.08); animation: ctaPulse 2.4s ease-in-out infinite; }
.attract-cta svg { width: 5.2rem; }
@keyframes ctaPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
.attract-foot { position: absolute; left: 7.2rem; right: 7.2rem; bottom: 4.4rem; display: flex; justify-content: space-between; align-items: center; font-size: 2rem; color: var(--muted); }
.attract-foot img { height: 4.8rem; display: block; }
.fs-btn { position: absolute; right: 2.4rem; top: 2.4rem; width: 6.4rem; height: 6.4rem; border-radius: 1.6rem; background: rgba(42,42,42,0.8); display: flex; align-items: center; justify-content: center; z-index: 2; }
.fs-btn svg { width: 3rem; }

/* ---- Leaderboard panel (shared) ---- */
.lb { background: var(--deep); padding: 4.8rem 3.6rem 3.6rem; display: flex; flex-direction: column; gap: 2rem; }
.lb-head { display: flex; justify-content: space-between; align-items: baseline; }
.lb-head h2 { margin: 0; font-size: 4.4rem; }
.lb-head span { font-size: 1.8rem; color: var(--muted); }
.lb-list { display: flex; flex-direction: column; gap: 0.8rem; }
.lb-row { display: flex; align-items: center; gap: 1.6rem; background: var(--panel-2); border-radius: 1.4rem; padding: 1.1rem 1.6rem; }
.lb-row .rk { width: 4.4rem; height: 4.4rem; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 800; font-size: 2.4rem; background: #333; }
.lb-row.top .rk { background: var(--orange); color: var(--charcoal); }
.lb-row .nm { flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.2rem; }
.lb-row .nm b { font-weight: 600; font-size: 2.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb-row .nm i { font-style: normal; font-size: 1.5rem; color: var(--muted); }
.lb-row .sc { font-family: var(--display); font-weight: 700; font-size: 3rem; }
.lb-row.me { background: var(--orange); color: var(--charcoal); }
.lb-row.me .rk { background: var(--charcoal); color: var(--orange); }
.lb-row.me .nm i { color: var(--charcoal); }
.lb-empty { font-size: 2.2rem; color: var(--grey); background: var(--panel-2); border-radius: 1.4rem; padding: 2.4rem; line-height: 1.4; }
.lb-foot { margin-top: auto; font-size: 1.6rem; color: var(--muted); }

/* ---- Common screen frame ---- */
.frame { position: absolute; inset: 0; padding: 4.4rem 8.4rem 6rem; display: flex; flex-direction: column; gap: 3.2rem; background: var(--charcoal); }
.topbar { display: flex; align-items: center; justify-content: space-between; min-height: 8rem; gap: 2rem; }
.topbar .wm { width: 34rem; }
.chip-me { display: flex; align-items: center; gap: 1.2rem; background: var(--panel); border-radius: 999px; padding: 1rem 2.4rem 1rem 1rem; font-weight: 600; font-size: 2.4rem; }
.chip-me .av { width: 4.8rem; height: 4.8rem; border-radius: 50%; background: var(--orange); color: var(--charcoal); display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 800; font-size: 2.2rem; }
.h1 { font-size: 7.6rem; margin: 0; }
.sub { font-size: 2.6rem; color: var(--grey); }
.sub b { color: var(--orange); }

/* ---- Name entry ---- */
.name-wrap { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.4rem; min-height: 0; }
.fields { display: flex; gap: 2rem; width: min(150rem, 100%); }
.field { flex: 3; background: var(--panel); border-radius: 2rem; padding: 1.6rem 2.8rem; display: flex; flex-direction: column; gap: 0.6rem; box-shadow: inset 0 0 0 0.3rem transparent; text-align: left; }
.field.small { flex: 2; }
.field.active { box-shadow: inset 0 0 0 0.3rem var(--orange); }
.field label { font-size: 1.8rem; color: var(--muted); }
.field .val { font-family: var(--display); font-weight: 700; font-size: 5.6rem; line-height: 1.1; min-height: 6.2rem; white-space: nowrap; overflow: hidden; }
.field.small .val { font-size: 4rem; min-height: 4.4rem; }
.field .ph { color: #6B6B6B; }
.caret { display: inline-block; width: 0.3rem; height: 0.9em; background: var(--orange); vertical-align: -0.1em; margin-left: 0.3rem; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.name-msg { min-height: 3rem; font-size: 2.4rem; color: var(--miss); }
.kb { display: flex; flex-direction: column; gap: 1.2rem; width: min(150rem, 100%); }
.kb-row { display: flex; gap: 1.2rem; justify-content: center; }
.key { flex: 1 1 0; max-width: 13rem; height: 9rem; border-radius: 1.6rem; background: var(--panel); font-family: var(--display); font-weight: 700; font-size: 4rem; }
.key:active, .key.down { background: #3A3A3A; }
.key.wide { max-width: 22rem; flex-grow: 1.8; font-family: var(--body); font-weight: 600; font-size: 2.4rem; }
.key.space { max-width: 56rem; flex-grow: 5; font-family: var(--body); font-weight: 600; font-size: 2.4rem; }
.key.on { background: var(--orange); color: var(--charcoal); }
.key.go { max-width: 40rem; flex-grow: 3.6; background: var(--orange); color: var(--charcoal); font-style: italic; font-weight: 800; font-size: 3.8rem; }
.key.go[disabled] { opacity: 0.35; }
.name-actions { display: flex; gap: 2rem; }
.name-actions .btn-primary { font-size: 4.4rem; height: 9.6rem; padding: 0 7rem; }
.name-actions .btn-ghost { font-size: 2.4rem; height: 9.6rem; padding: 0 4rem; }
.btn-primary[disabled] { opacity: 0.35; }

/* ---- Domain picker ---- */
.picker-head { display: flex; align-items: baseline; justify-content: space-between; gap: 2rem; flex-wrap: wrap; }
.tiles { flex-grow: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: 1fr; gap: 2.8rem; }
.tile { text-align: left; background: var(--panel); border-radius: 2.8rem; padding: 3.2rem; display: flex; flex-direction: column; gap: 1.8rem; transition: transform 0.12s, box-shadow 0.12s; }
.tile:active { transform: translateY(-0.6rem); box-shadow: 0 0 0 0.4rem var(--orange); }
.tile .ring { width: 10.4rem; height: 10.4rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.tile .ring svg { width: 5.8rem; }
.tile h3 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 4rem; line-height: 1.02; }
.tile p { margin: 0; font-size: 2.1rem; color: var(--muted); line-height: 1.35; }
.tile[disabled] { opacity: 0.35; }

/* ---- HUD ---- */
.hud-bar { position: absolute; left: 5.6rem; right: 5.6rem; top: 2.8rem; height: 8.8rem; display: flex; align-items: center; justify-content: space-between; }
.lives { display: flex; align-items: center; gap: 1.4rem; width: 40rem; }
.life { width: 6.4rem; height: 2.8rem; border-radius: 1.4rem; overflow: hidden; display: flex; }
.life i { width: 40%; background: var(--orange); }
.life b { flex-grow: 1; background: var(--capsule); }
.life.lost { box-shadow: inset 0 0 0 0.2rem var(--line); }
.life.lost i, .life.lost b { display: none; }
.timer { display: flex; flex-direction: column; align-items: center; gap: 0.8rem; width: 30rem; }
.timer .t { font-family: var(--display); font-weight: 800; font-size: 6rem; line-height: 1; }
.timer.low .t { color: var(--miss); }
.tbar { width: 30rem; height: 0.8rem; border-radius: 0.4rem; background: #333; overflow: hidden; }
.tbar div { height: 100%; background: var(--orange); width: 100%; }
.scorebox { display: flex; align-items: center; gap: 2rem; width: 40rem; justify-content: flex-end; }
.rankchip { background: var(--panel); border-radius: 999px; padding: 1rem 2rem; font-family: var(--display); font-weight: 700; font-size: 2.6rem; white-space: nowrap; }
.rankchip b { color: var(--orange); }
.score { font-size: 7.2rem; }
.qcard { position: absolute; left: 50%; transform: translateX(-50%); top: 13.2rem; width: min(150rem, calc(100% - 8rem)); background: var(--panel); border-radius: 2.8rem; padding: 2.6rem 4.4rem 3rem; display: flex; flex-direction: column; gap: 1.4rem; box-shadow: 0 1.8rem 4rem rgba(0,0,0,0.35); }
.qmeta { display: flex; justify-content: space-between; align-items: center; font-size: 2rem; color: var(--muted); }
.qdom { display: flex; align-items: center; gap: 1rem; font-weight: 600; }
.qdom svg { width: 2.8rem; }
.qtext { font-weight: 600; font-size: 5rem; line-height: 1.15; }
.qcard.enter { animation: qIn 0.35s cubic-bezier(.2,.9,.3,1.2); }
@keyframes qIn { from { transform: translateX(-50%) translateY(-1.6rem); opacity: 0; } }
.streak { position: absolute; left: 5.6rem; display: none; align-items: center; gap: 1.2rem; }
.streak.on { display: flex; animation: pop 0.4s cubic-bezier(.2,.9,.3,1.4); }
.streak .m { width: 7.2rem; }
.streak .pill { display: flex; align-items: center; gap: 1.2rem; background: var(--panel); border-radius: 999px; padding: 1rem 2.4rem 1rem 1rem; box-shadow: 0 0 0 0.2rem var(--orange); }
.streak.x2 .pill { background: var(--orange); color: var(--charcoal); }
.streak .x { width: 5rem; height: 5rem; border-radius: 50%; background: var(--orange); color: var(--charcoal); display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 800; font-style: italic; font-size: 2.6rem; }
.streak.x2 .x { background: var(--charcoal); color: var(--orange); }
.streak .n { font-family: var(--display); font-weight: 700; font-size: 3rem; }
@keyframes pop { from { transform: scale(0.6); opacity: 0; } }
.sad { position: absolute; width: 11rem; pointer-events: none; animation: sadPop 1.1s ease-out forwards; }
@keyframes sadPop { 0% { transform: translate(-50%, -30%) scale(0.4); opacity: 0; } 20% { transform: translate(-50%, -60%) scale(1.05); opacity: 1; } 70% { opacity: 1; } 100% { transform: translate(-50%, -110%) scale(0.95); opacity: 0; } }
.flash { position: absolute; inset: 0; box-shadow: inset 0 0 0 1.2rem var(--miss); opacity: 0; pointer-events: none; }
.flash.go { animation: flash 0.45s ease-out; }
@keyframes flash { 0% { opacity: 0.9; } 100% { opacity: 0; } }
.countdown { position: absolute; left: 0; right: 0; top: 50%; margin-top: -10rem; text-align: center; font-size: 20rem; color: var(--orange); display: none; }
.countdown.on { display: block; animation: pop 0.5s cubic-bezier(.2,.9,.3,1.4); }

/* ---- Results ---- */
#s-results.on { display: grid; grid-template-columns: 44rem minmax(0, 1fr) 44rem; grid-template-rows: minmax(0, 1fr); background: var(--charcoal); }
.res-sum { padding: 4.8rem 4rem 4.4rem 5.6rem; display: flex; flex-direction: column; gap: 2.4rem; }
.res-hello { display: flex; align-items: flex-end; gap: 1.6rem; }
.res-hello .mascot { width: 13rem; }
.res-hello div { display: flex; flex-direction: column; gap: 0.4rem; padding-bottom: 1rem; }
.res-hello small { font-size: 2rem; color: var(--muted); }
.res-hello b { font-size: 4rem; color: var(--orange); }
.res-score small { font-size: 2rem; color: var(--muted); }
.res-score div { font-size: 12rem; line-height: 0.95; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.4rem; }
.stat { background: var(--panel); border-radius: 2rem; padding: 1.8rem 2rem; display: flex; flex-direction: column; gap: 0.4rem; }
.stat small { font-size: 1.7rem; color: var(--muted); }
.stat b { font-family: var(--display); font-weight: 800; font-size: 4.8rem; line-height: 1; }
.stat b.o { color: var(--orange); }
.stat b.d { font-size: 2.4rem; font-weight: 700; line-height: 1.05; }
.res-actions { margin-top: auto; display: flex; flex-direction: column; gap: 1.4rem; }
.res-actions .btn-primary { height: 9.6rem; font-size: 4.4rem; }
.res-actions .btn-ghost { height: 7.2rem; font-size: 2.4rem; }
.res-review { min-width: 0; padding: 4.8rem 3.6rem 4.4rem; display: flex; flex-direction: column; gap: 2rem; min-height: 0; }
.res-review .lb-head h2 { font-size: 4.4rem; }
.review { flex-grow: 1; min-height: 0; overflow-y: auto; touch-action: pan-y; display: flex; flex-direction: column; gap: 1.2rem; padding-right: 0.6rem; scrollbar-width: thin; scrollbar-color: #4A4A4A transparent; }
.rv { background: var(--panel); border-radius: 2rem; padding: 1.8rem 2.4rem; display: flex; gap: 1.8rem; flex-shrink: 0; }
.rv .ic { flex-shrink: 0; width: 4.4rem; height: 4.4rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.rv .ic svg { width: 2.4rem; }
.rv.c .ic { background: var(--orange); } .rv.w .ic { background: var(--miss); } .rv.m .ic { background: var(--line); }
.rv .body { min-width: 0; display: flex; flex-direction: column; gap: 0.8rem; }
.rv .q { font-weight: 600; font-size: 2.3rem; line-height: 1.25; }
.rv .chips { display: flex; flex-wrap: wrap; gap: 1rem; }
.rv .chips span { font-size: 1.7rem; border-radius: 999px; padding: 0.5rem 1.4rem; background: var(--charcoal); }
.rv.c .you { color: var(--orange); } .rv.w .you { color: #FF8C82; } .rv.m .you { color: var(--muted); }
.rv .ans { color: var(--orange); }
.rv .e { font-size: 1.8rem; line-height: 1.4; color: #BDBDBD; }
#s-results .lb { padding: 4.8rem 3.2rem 3.6rem; }
#s-results .lb-head h2 { font-size: 4rem; }
#s-results .lb-row .nm i { display: none; }

/* ---- Admin (functional, not themed) ---- */
#s-admin { background: rgba(10,10,10,0.92); font-family: system-ui, 'Segoe UI', sans-serif; }
.adm { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(80rem, 94vw); background: #fff; color: #1F1F1F; border-radius: 1.2rem; padding: 3.2rem; display: flex; flex-direction: column; gap: 2rem; font-size: 2rem; }
.adm h2 { margin: 0; font-size: 3rem; }
.adm .pin { font-size: 5rem; letter-spacing: 1.2rem; text-align: center; font-family: ui-monospace, Consolas, monospace; min-height: 6rem; }
.adm .pad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
.adm .pad button, .adm .row button { height: 8rem; border-radius: 0.8rem; background: #EEE; font-size: 3rem; font-weight: 600; }
.adm .row { display: flex; align-items: center; justify-content: space-between; gap: 2rem; padding: 1.2rem 0; border-bottom: 0.1rem solid #E5E5E5; }
.adm .row button { height: 6rem; min-width: 14rem; font-size: 2rem; }
.adm .row button.on { background: #1F1F1F; color: #fff; }
.adm .note { color: #666; font-size: 1.7rem; }
.adm .err { color: #C0392B; min-height: 2.4rem; }
.adm .close { align-self: flex-end; height: 6rem; padding: 0 3rem; border-radius: 0.8rem; background: #1F1F1F; color: #fff; font-size: 2rem; }

/* ---- Portrait ---- */
@media (orientation: portrait) {
  #s-attract.on { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
  .attract-lockup { flex-direction: column; top: 9%; gap: 2rem; }
  .attract-lockup .wm { width: 76rem; }
  .attract-lockup .mascot { width: 20rem; }
  .attract-tag { top: 47%; padding: 0 4rem; }
  .attract-cta { top: 56%; }
  .attract-foot { bottom: 2.4rem; left: 4.4rem; right: 4.4rem; }
  #s-attract .lb { padding: 3.2rem 4.4rem; }
  #s-attract .lb-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  #s-attract .lb-foot { display: none; }
  .frame { padding: 3.6rem 4.4rem 4.4rem; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2rem; }
  .tile { padding: 2.4rem; gap: 1.2rem; }
  .tile .ring { width: 8rem; height: 8rem; } .tile .ring svg { width: 4.6rem; }
  .fields { flex-direction: column; }
  .key { height: 10rem; }
  .hud-bar { left: 4.4rem; right: 4.4rem; flex-wrap: wrap; height: auto; row-gap: 1.6rem; }
  .lives { width: auto; } .scorebox { width: auto; }
  .timer { order: 3; width: 100%; flex-direction: row; gap: 1.8rem; } .timer .t { font-size: 4.4rem; } .tbar { flex-grow: 1; height: 1rem; }
  .qcard { top: 19rem; padding: 2.6rem 3.6rem 3.2rem; }
  .streak { left: 4.4rem; }
  #s-results.on { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr) auto; }
  .res-sum { padding: 3.6rem 4.4rem 1rem; display: grid; grid-template-columns: 1fr 1fr; align-items: end; }
  .res-sum .stats { grid-column: 1 / -1; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .res-actions { grid-column: 1 / -1; flex-direction: row; } .res-actions button { flex: 1; }
  .res-review { padding: 2rem 4.4rem; }
  #s-results .lb { padding: 2.4rem 4.4rem 3.2rem; }
  #s-results .lb-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  #s-results .lb-foot { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .attract-cta .btn-primary, .caret { animation: none; }
}
</style>
</head>
<body>
<div id="stage"></div>
<div id="ui">

  <!-- ATTRACT: idle loop with live leaderboard -->
  <section id="s-attract" class="screen">
    <div class="attract-main">
      <button class="fs-btn" id="fs-btn" aria-label="Full screen"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <div class="attract-lockup"><div class="wm" data-svg="wordmark-stacked"></div><div class="mascot" data-svg="mascot-ready"></div></div>
      <div class="attract-tag">Slice the right answer. 75 seconds. 8 domains. Top 10 today.</div>
      <div class="attract-cta"><button class="btn-primary" id="cta-play"><svg viewBox="0 0 48 48" fill="none" stroke="#1F1F1F" stroke-width="4" stroke-linecap="round"><path d="M6 40 L42 8"/><path d="M10 26 L20 16" stroke-opacity="0.45"/><path d="M22 42 L32 32" stroke-opacity="0.45"/></svg>Touch to play</button></div>
      <div class="attract-foot"><img alt="MResult" src="data:image/png;base64,__LOGO__"><span>Global Pharma Partnering Summit 2026, Booth G1</span></div>
    </div>
    <aside class="lb" id="lb-attract"></aside>
  </section>

  <!-- NAME ENTRY: built-in keyboard (kiosk browsers often don't raise the OS one) -->
  <section id="s-name" class="screen">
    <div class="frame">
      <div class="topbar"><div class="wm" data-svg="wordmark-h"></div><button class="btn-ghost" id="name-back" style="height:6.8rem;padding:0 3rem;font-size:2.2rem">Back</button></div>
      <div class="name-wrap">
        <h1 class="h1 display">Pick a display name</h1>
        <div class="sub" style="margin-top:-1.6rem">It goes on today’s leaderboard. No real name needed.</div>
        <div class="fields">
          <button class="field active" id="f-name"><label>Display name</label><div class="val" id="v-name"></div></button>
          <button class="field small" id="f-vid"><label>Visitor ID (optional)</label><div class="val" id="v-vid"></div></button>
        </div>
        <div class="name-msg" id="name-msg"></div>
        <div class="kb" id="kb"></div>
      </div>
    </div>
  </section>

  <!-- DOMAIN PICKER -->
  <section id="s-picker" class="screen">
    <div class="frame">
      <div class="topbar"><div class="wm" data-svg="wordmark-h"></div><div style="display:flex;gap:1.6rem;align-items:center"><div class="chip-me" id="pk-me"></div><button class="btn-ghost" id="pk-back" style="height:6.8rem;padding:0 3rem;font-size:2.2rem">Change name</button></div></div>
      <div class="picker-head"><h1 class="h1 display">Pick your domain</h1><div class="sub" id="pk-sub"></div></div>
      <div class="tiles" id="tiles"></div>
    </div>
  </section>

  <!-- GAMEPLAY HUD (capsules themselves are drawn in the Phaser canvas below) -->
  <section id="s-hud" class="screen hud">
    <div class="hud-bar">
      <div class="lives" id="h-lives"></div>
      <div class="timer" id="h-timer"><div class="t" id="h-time">1:15</div><div class="tbar"><div id="h-tbar"></div></div></div>
      <div class="scorebox"><div class="rankchip" id="h-rank"></div><div class="score display" id="h-score">0</div></div>
    </div>
    <div class="qcard" id="h-card"><div class="qmeta"><div class="qdom" id="h-dom"></div><div id="h-qn"></div></div><div class="qtext" id="h-q"></div></div>
    <div class="streak" id="h-streak"><div class="m" data-svg="mascot-cheer"></div><div class="pill"><div class="x" id="h-x">×1.5</div><div class="n" id="h-n">3 in a row</div></div></div>
    <div class="countdown display" id="h-count">3</div>
    <div class="flash" id="h-flash"></div>
    <div id="h-fx"></div>
  </section>

  <!-- RESULTS + REVIEW + LEADERBOARD -->
  <section id="s-results" class="screen">
    <div class="res-sum">
      <div class="res-hello"><div class="mascot" id="r-mascot"></div><div><small id="r-hi"></small><b class="display" id="r-head"></b></div></div>
      <div class="res-score"><small>Score</small><div class="display" id="r-score"></div></div>
      <div class="stats">
        <div class="stat"><small>Today’s rank</small><b class="o" id="r-rank"></b></div>
        <div class="stat"><small>Accuracy</small><b id="r-acc"></b></div>
        <div class="stat"><small>Longest streak</small><b id="r-streak"></b></div>
        <div class="stat"><small>Domain</small><b class="d" id="r-dom"></b></div>
      </div>
      <div class="res-actions"><button class="btn-primary" id="r-again">Play again</button><button class="btn-ghost" id="r-done">Done</button></div>
    </div>
    <div class="res-review"><div class="lb-head"><h2 class="display">Your answers</h2><span id="r-count"></span></div><div class="review" id="r-review"></div></div>
    <aside class="lb" id="lb-results"></aside>
  </section>

  <!-- ADMIN (stub in Milestone 1): PIN, then sound toggles -->
  <section id="s-admin" class="screen"><div class="adm" id="adm"></div></section>
</div>

<script>__PHASER__</script>
<script>__DATA__</script>
<script>__APP__</script>
</body>
</html>
